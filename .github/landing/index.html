<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Majestic Face Sweater</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        font-family: system-ui, sans-serif;
      }
      img {
        max-width: min(100%, 800px);
        max-height: 80vh;
        object-fit: contain;
      }
      a {
        color: #fff;
        text-decoration: underline;
        font-size: 0.9rem;
        opacity: 0.5;
        letter-spacing: 0.05em;
      }
      a:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <img src="./majestic.png" alt="" />
    <a href="/dnd35/">D&amp;D 3.5e Character Builder</a>
  </body>
</html>
